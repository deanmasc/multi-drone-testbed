simulation:
  dt: 0.1
  control_rate: 10.0   # Hz -- faster than PrintState; this one actually moves
  sim_rate: 10.0
  bounds: 2.0

drones:
  # Simulation only -- on hardware the start position comes from mocap, and the
  # square anchors wherever the drone physically is. Kept in step with the real
  # placement so sim and hardware sweep the same box.
  - id: "drone1"
    initial_position: [-1.0, -1.0]
    initial_velocity: [0.0, 0.0]
    role: "leader"

# A 0.5m square at 0.15 m/s with rounded corners: 11.6s for a full lap (shorter
# than the 13.3s of a hard-cornered lap, since the arcs cut the perimeter).
# Pass flight_duration:=16 or more, or the run lands partway round.
#
# The square anchors at the drone's real position when the algorithm begins and
# extends +x and +y from there -- nothing in this file sets that, it comes from
# mocap. Starting at (-0.25, -0.25) centres it on the world origin; starting at
# (-1, -1) puts it in the corner of the volume. Either fits the default
# +/-1.5m geofence easily at this size.
algorithm:
  name: "Square"
  params:
    side: 0.5          # m
    speed: 0.15        # m/s
    start_delay: 3.0   # s of hover before moving, lets takeoff settle
    gain_kp: 1.0
    gain_kd: 0.6
    max_accel: 0.3     # m/s^2
    # Corners are replaced by quarter-circle arcs of this radius. A hard corner
    # demands an instant velocity reversal -- infinite acceleration -- and the
    # firmware answers by slamming the attitude over, which is the visible jerk
    # and the least stable moment of the flight. At 0.15m the peak commanded
    # acceleration drops from effectively infinite to 0.15 m/s^2. Set 0 to get
    # hard corners back for comparison.
    corner_radius: 0.15  # m
    # Flight log for judging path quality after the fact. Empty log_file puts a
    # timestamped file in whatever directory you launched from, so runs never
    # overwrite each other. log_interval cannot resolve finer than the control
    # period above (0.1s at control_rate 10.0).
    log_file: ""
    log_interval: 0.1  # s
