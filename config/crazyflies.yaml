# Crazyswarm2 drone configuration (fileversion 3 schema)
# Edit before running hardware tests:
#   - uri: find channel/datarate with
#     `python3 -c "import cflib.crtp; cflib.crtp.init_drivers(); print(cflib.crtp.scan_interfaces())"`
#     then append the drone's radio address -- E7E7E7E7E7 is the Bitcraze factory
#     default; crazyflie_cpp requires the full 4-part radio://<id>/<channel>/<datarate>/<address>
#     form, unlike cflib's scan output which omits the address for the default case.
#   - The top-level key under `robots:` (e.g. "drone_1") MUST match the rigid
#     body name registered in VICON Tracker exactly (case-sensitive), and is
#     what cf_name/mocap_name must be set to.
#   - initial_position: informational under "vendor" tracking -- identification
#     is by name, not proximity. Keep it roughly right anyway.

fileversion: 3

robots:
  drone_1:
    enabled: true
    uri: radio://0/20/2M/E7E7E7E7E7
    initial_position: [0.235, -0.132, 0.0158]
    type: cf21
  # Second airframe. TWO physical drones have occupied this slot, and they are
  # told apart ONLY by channel/datarate, because both sit on the factory-default
  # address E7E7E7E7E7. That is exactly how they were confused on 2026-09-01: a
  # scan was read as "the same drone changed its radio settings" when it was in
  # fact a different airframe answering. Label the airframes physically, and see
  # the address note below.
  #
  #   radio://0/50/250K/E7E7E7E7E7  -- flown 25 Aug to 2 Sep. This is the
  #     airframe that tracked worst in the 2026-09-02 campaign: worst RMS
  #     centroid distance in all four coverage runs, and it ended six of the
  #     seven runs. Note it also carried by far the worst radio link (below),
  #     so "bad airframe" and "bad link" were never separated. Do not treat the
  #     airframe as proven faulty on that evidence alone.
  #
  #   radio://0/65/1M/E7E7E7E7E7    -- IN USE. Tried briefly on 2026-09-01 and
  #     reverted that day because its firmware predated 2023.02:
  #         Unable to find variable [stateEstimate.x]
  #         Unable to find variable [supervisor.info]
  #     The failed log config aborted PARAMETER setup for it, so it never
  #     received commander.enHighLevel, stabilizer.estimator or
  #     locSrv.extPosStdDev -- while crazyflie_server still printed "All
  #     Crazyflies parameters are initialized". With the high-level commander
  #     off and the Kalman estimator unset it could neither take off nor use
  #     VICON. FIRMWARE FLASHED 2026-09-08, so it is back in service here.
  #
  # If a flash did not take, the tell in the launch log is that every parameter
  # line reads [drone_1] and none reads [drone_2]. Check for that before
  # assuming a radio fault -- the drone still reports "is fully connected!".
  #
  # RADIO FIXED 2026-09-08. Both drones now share channel 20 at 2M and are
  # separated by ADDRESS instead. Verified with scripts/find_drones.py:
  #     E7E7E7E7E7  ->  radio://0/20/2M/E7E7E7E7E7   (drone_1)
  #     E7E7E7E7E8  ->  radio://0/20/2M/E7E7E7E7E8   (drone_2)
  #
  # Why this matters, because it is easy to undo by accident:
  #
  #   - One Crazyradio dongle serves both drones and can only be tuned to one
  #     channel/datarate pair at a time. Previously drone_1 was on 20/2M and
  #     drone_2 on 50/250K (then 65/1M), so the dongle retuned between every
  #     single packet. That cost throughput and added jitter to the 25Hz
  #     cmdFullState stream both position controllers depend on -- an
  #     asymmetric penalty paid only by drone_2, which is also the drone that
  #     tracked worst. Those two facts were never separated; do not read the
  #     2026-09-02 campaign as proof that the drone_2 airframe is faulty.
  #
  #   - Sharing one channel and datarate is what lets Crazyswarm2's broadcast
  #     path (the `broadcasts:` block below) address both drones in one packet.
  #
  #   - Separating by address is also the only thing that makes the two
  #     airframes reliably distinguishable. Channel/datarate alone already
  #     failed at that once, on 2026-09-01.
  #
  # If you ever change a radio address, remember the stock one-liner scan only
  # looks at E7E7E7E7E7 and will silently miss the other drone. Use
  # scripts/find_drones.py, which sweeps addresses.
  #
  # The key name here must match the VICON Tracker rigid body exactly, and is
  # what cf_name/mocap_name are set to on the launch command line.
  drone_2:
    enabled: true
    uri: radio://0/20/2M/E7E7E7E7E8
    initial_position: [0.179, 0.219, 0.0158]
    type: cf21

  # Third airframe, added 2026-09-08. Same channel and datarate as the other
  # two, separated by address -- keep it that way, see the note above.
  #
  # initial_position matches drone3's mark in testbed_fig4.yaml. It is
  # informational under "vendor" tracking (identification is by name, not
  # proximity), but keep it honest so a scan of this file matches the floor.
  #
  # BEFORE FLYING THIS AS A THIRD REAL DRONE, read the SEPARATION note in
  # testbed_fig4.yaml. On that pattern only drone1-drone4 stays safely apart
  # (0.354 m); every trio puts two aircraft within 12 cm of each other in the
  # xy plane, and drone3-drone4 pass within 2 cm. There is no collision term
  # in TrochoidalConsensus -- it will fly them together and report success.
  #
  # DISABLED 2026-09-09. Only drone_1 and drone_2 are flying; with this true
  # the server waits on an airframe that is not powered on and the launch
  # stalls looking for it. Set it back to true when a third drone is actually
  # in the air.
  drone_3:
    enabled: false
    uri: radio://0/20/2M/E7E7E7E7E9
    initial_position: [-0.186, -0.034, 0.0158]
    type: cf21

robot_types:
  cf21:
    motion_capture:
      # Multi-marker rigid body (Tracker needs >=3 markers to define an object).
      # "vendor": VICON Tracker computes the 6-DOF pose itself and we relay its
      # named poses -- no marker-cloud fitting on the ROS side.
      #
      # Orientation is therefore REAL here, which couples to crazyflie_node's
      # use_mocap_yaw parameter: it must be true, so we hold the measured yaw.
      # Commanding yaw 0 while the firmware knows (from VICON) that it is at
      # some other heading produces a violent snap-turn.
      tracking: "vendor"
      marker: default
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8   # V
      voltage_critical: 3.7  # V

# global settings for all robots
all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2  # 1: complementary, 2: kalman
      controller: 2 # 1: PID, 2: mellinger
    locSrv:
      # Stock Crazyswarm2 defaults. Do not loosen these to "damp noise" -- a
      # larger stddev makes the onboard Kalman filter trust VICON less and lean
      # on IMU integration, so the z estimate drifts and the controller cuts
      # thrust before actually reaching the target height.
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1
