# Crazyswarm2 drone configuration (fileversion 3 schema)
# Edit before running hardware tests:
#   - uri: find channel/datarate with
#     `python3 -c "import cflib.crtp; cflib.crtp.init_drivers(); print(cflib.crtp.scan_interfaces())"`
#     then append the drone's radio address -- E7E7E7E7E7 is the Bitcraze factory
#     default; crazyflie_cpp requires the full 4-part radio://<id>/<channel>/<datarate>/<address>
#     form, unlike cflib's scan output which omits the address for the default case.
#   - The top-level key under `robots:` (e.g. "drone_1") MUST match the rigid
#     body name registered in VICON Tracker exactly (case-sensitive), and is
#     what cf_name/mocap_name must be set to.
#   - initial_position: informational under "vendor" tracking -- identification
#     is by name, not proximity. Keep it roughly right anyway.

fileversion: 3

robots:
  drone_1:
    enabled: true
    uri: radio://0/20/2M/E7E7E7E7E7
    initial_position: [0.235, -0.132, 0.0158]
    type: cf21
  # Second airframe. The scan reported this one as radio://0/50/250K, i.e. a
  # different channel AND a different datarate from drone_1.
  #
  # It will work as written, but it is not the configuration you want. One
  # Crazyradio dongle serves both drones, and it can only be tuned to one
  # channel/datarate pair at a time -- so with these settings it retunes
  # between every packet to drone_1 and every packet to drone_2. That costs
  # throughput and, worse, adds jitter to the 25Hz cmdFullState stream that
  # both drones' position controllers depend on. 250K also carries a packet in
  # eight times the airtime of 2M.
  #
  # The fix is a two-minute job in cfclient (Connect -> Console/Config, or the
  # "Radio Bandwidth"/"Radio Channel"/"Radio Address" fields under Settings):
  # put this drone on 2M, and separate the two by ADDRESS rather than by
  # datarate. Either of these is fine:
  #
  #     uri: radio://0/20/2M/E7E7E7E7E8    # same channel, different address
  #     uri: radio://0/80/2M/E7E7E7E7E7    # different channel, same datarate
  #
  # The first is better: sharing one channel and datarate is what lets
  # Crazyswarm2's broadcast path (the `broadcasts:` block below) address both
  # drones in a single packet. Note that both drones currently sit on the
  # factory-default address E7E7E7E7E7, so if you put them on the same channel
  # you MUST change one address or they will both answer to the same packets.
  #
  # The key name here must match the VICON Tracker rigid body exactly, and is
  # what cf_name/mocap_name are set to on the launch command line.
  drone_2:
    enabled: true
    uri: radio://0/50/250K/E7E7E7E7E7
    initial_position: [0.179, 0.219, 0.0158]
    type: cf21

robot_types:
  cf21:
    motion_capture:
      # Multi-marker rigid body (Tracker needs >=3 markers to define an object).
      # "vendor": VICON Tracker computes the 6-DOF pose itself and we relay its
      # named poses -- no marker-cloud fitting on the ROS side.
      #
      # Orientation is therefore REAL here, which couples to crazyflie_node's
      # use_mocap_yaw parameter: it must be true, so we hold the measured yaw.
      # Commanding yaw 0 while the firmware knows (from VICON) that it is at
      # some other heading produces a violent snap-turn.
      tracking: "vendor"
      marker: default
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8   # V
      voltage_critical: 3.7  # V

# global settings for all robots
all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2  # 1: complementary, 2: kalman
      controller: 2 # 1: PID, 2: mellinger
    locSrv:
      # Stock Crazyswarm2 defaults. Do not loosen these to "damp noise" -- a
      # larger stddev makes the onboard Kalman filter trust VICON less and lean
      # on IMU integration, so the z estimate drifts and the controller cuts
      # thrust before actually reaching the target height.
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1
