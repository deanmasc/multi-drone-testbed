<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper figures</title></head><body><style>
:root{
  --ground:#f7f6f3; --card:#fffffe; --ink:#16181c; --ink-2:#4a4f57;
  --ink-3:#7c828c; --line:#e3e1db; --shadow:0 1px 2px rgba(20,18,14,.06),0 8px 24px rgba(20,18,14,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#14161a; --card:#1c1f25; --ink:#f2f3f5; --ink-2:#b9bec7;
  --ink-3:#848b96; --line:#2b3039; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#14161a; --card:#1c1f25; --ink:#f2f3f5; --ink-2:#b9bec7;
  --ink-3:#848b96; --line:#2b3039; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;
  display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--ink-3);font-size:13px}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{padding:28px;max-width:1500px;margin:0 auto}
section{margin:0 0 46px}
section h2{font-size:22px;margin:0 0 4px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
section .blurb{color:var(--ink-2);max-width:68ch;margin:0 0 16px}
table.stats{border-collapse:collapse;margin:0 0 22px;font-size:13px;
  font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
table.stats th{text-align:right;font-weight:600;color:var(--ink-3);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;padding:9px 13px;border-bottom:1px solid var(--line)}
table.stats td{text-align:right;padding:8px 13px;border-bottom:1px solid var(--line)}
table.stats tr:last-child td{border-bottom:none}
table.stats td.rung,table.stats th:first-child{text-align:left;font-weight:600;color:var(--ink)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.keygrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
figure.big figcaption{padding:16px 18px 20px}
figure.big figcaption b{font-size:17px;letter-spacing:-.01em;margin-bottom:6px}
figure.big figcaption span{font-size:14px;line-height:1.5}
section.key h2::before{background:var(--ink)}
details{margin-top:6px}
details>summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:9px 14px;
  border:1px solid var(--line);border-radius:999px;display:inline-block;
  background:var(--card);list-style:none;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--ink-3)}
details[open]>summary::before{content:"▾ "}
details>summary:hover{color:var(--ink)}
details>.grid{margin-top:18px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
figure img{width:100%;display:block;background:#fff;cursor:zoom-in}
figcaption{padding:13px 15px 15px}
figcaption b{display:block;font-size:14px;margin-bottom:3px}
figcaption span{color:var(--ink-2);font-size:13px}
.empty{color:var(--ink-3);font-style:italic;padding:14px 0}
dialog{border:none;background:transparent;max-width:96vw;max-height:96vh;padding:0}
dialog::backdrop{background:rgba(10,10,12,.86)}
dialog img{max-width:96vw;max-height:88vh;background:#fff;border-radius:8px;display:block}
dialog .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
  color:#e9e9ea;font-size:13px;padding:10px 4px}
dialog button{font:inherit;background:transparent;border:1px solid #55585e;color:#e9e9ea;
  border-radius:8px;padding:4px 11px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){figure{transition:transform .12s ease}
  figure:hover{transform:translateY(-1px)}}

.sheet{max-width:1180px;margin:0 auto;padding:0 18px 64px}
.pf{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);margin:0 0 26px;padding:18px 18px 14px}
.pf .plate{background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:10px;display:flex;justify-content:center}
.pf img{display:block;height:auto;image-rendering:auto}
.pf .meta{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;flex-wrap:wrap}
.pf .num{font-weight:700;color:var(--ink)}
.pf .w{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pf .w code{background:var(--ground);padding:1px 6px;border-radius:4px}
.pf figcaption{margin:12px 2px 0;color:var(--ink-2);font-size:14.5px;line-height:1.55}
.pf figcaption b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pf .plate{background:#f7f7f5}}
:root[data-theme="dark"] .pf .plate{background:#f7f7f5}
</style><header class="top"><h1>Paper figures</h1><span class="sub">the shortlist that goes in the report, shown at the width it prints at — 3.5 in for a column, 6.5 in for full width. No figure carries a title: the caption is the title.</span></header><main class="sheet"><figure class="pf"><div class="meta"><span class="num">Fig. 1</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_trochoidal_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_trochoidal_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 1" style="width:100.0%;max-width:975px" src="paper/fig_trochoidal_design.png"></div><figcaption><b>Fig. 1.</b> Designed against flown position for the trochoidal law, over the first 20 s of each flight, at four of the eight gain rungs. Grey is the same configuration in the noiseless simulator, started from where the drones actually were when the algorithm engaged; colour is VICON. At k·τ 0.56 and 0.84 the aircraft sits on the designed pattern. At 1.12 a ripple appears on top of it and does not decay, and at 3.92 the pattern is barely visible beneath it. The loops in the left-hand panels have a period of about 1.1 s at every rung, set by the loop delay rather than by the gain.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 2</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_trochoidal_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_trochoidal_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 2" style="width:53.8%;max-width:525px" src="paper/fig_noise_trochoidal_box.png"></div><figcaption><b>Fig. 2.</b> Deviation from the designed trochoidal pattern against injected position noise, at β = 2 where the gain ladder is quiet, so the exact-state assumption is probed on its own. Box is the middle half of the flight, whiskers the 5th to 95th percentile. Every other parameter is identical across the four flights.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 3</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_coverage_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_coverage_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 3" style="width:100.0%;max-width:975px" src="paper/fig_coverage_design.png"></div><figcaption><b>Fig. 3.</b> Designed against flown position for Voronoi coverage at three gain settings, 20 s from the middle of each flight. The label in each right panel is the median distance between the two lines over that window.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 4</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_coverage_benchmarks.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_coverage_benchmarks.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 4" style="width:100.0%;max-width:975px" src="paper/fig_coverage_benchmarks.png"></div><figcaption><b>Fig. 4.</b> Coverage under injected position noise. Top row: how the aircraft flew. Deviation and oscillation are computed from the recorded position, which carries the injected noise, so each bar is shown against a sensor-only null — the control flight re-measured through that rung&#x27;s noise. Tilt comes from the motion-capture pose stream, which the injection never touches. Bottom row: the three quantities the coverage result is stated in. All three span a few percent of their own mean across a ladder that moves the aircraft by a factor of five.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 5</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_coverage_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_coverage_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 5" style="width:53.8%;max-width:525px" src="paper/fig_noise_coverage_box.png"></div><figcaption><b>Fig. 5.</b> Deviation from the designed coverage configuration against injected position noise, with the sensor-only null marked on each rung.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 6</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_flocking_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_flocking_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 6" style="width:100.0%;max-width:975px" src="paper/fig_flocking_design.png"></div><figcaption><b>Fig. 6.</b> Designed against flown position for Olfati-Saber flocking at three time-rescalings, 20 s from the middle of each flight. The rescaling leaves the lattice and the path unchanged and moves only the rate at which the law acts, so k·τ is the only quantity that differs between rows.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 7</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_flocking_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_flocking_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 7" style="width:53.8%;max-width:525px" src="paper/fig_noise_flocking_box.png"></div><figcaption><b>Fig. 7.</b> Deviation from the designed flocking lattice against injected position noise. The control sits above the 2 mm rung; both were flown twice and reproduce to 0.3 cm, so the ordering is a real property of the ladder rather than a bad flight.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 8</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_kuramoto_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_kuramoto_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 8" style="width:53.8%;max-width:525px" src="paper/fig_noise_kuramoto_box.png"></div><figcaption><b>Fig. 8.</b> Deviation from the designed ring for the Kuramoto law against injected position noise. Every rung sits on its own sensor-only null, so the injection accounts for the whole reading and the flight itself does not degrade — unlike the trochoidal and coverage ladders, which move by a factor of five under the same lever.</figcaption></figure></main></body></html>
