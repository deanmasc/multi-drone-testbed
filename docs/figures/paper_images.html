<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper figures</title></head><body><style>
:root{
  --ground:#f7f6f3; --card:#fffffe; --ink:#16181c; --ink-2:#4a4f57;
  --ink-3:#7c828c; --line:#e3e1db; --shadow:0 1px 2px rgba(20,18,14,.06),0 8px 24px rgba(20,18,14,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#14161a; --card:#1c1f25; --ink:#f2f3f5; --ink-2:#b9bec7;
  --ink-3:#848b96; --line:#2b3039; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#14161a; --card:#1c1f25; --ink:#f2f3f5; --ink-2:#b9bec7;
  --ink-3:#848b96; --line:#2b3039; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;
  display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--ink-3);font-size:13px}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{padding:28px;max-width:1500px;margin:0 auto}
section{margin:0 0 46px}
section h2{font-size:22px;margin:0 0 4px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent)}
section .blurb{color:var(--ink-2);max-width:68ch;margin:0 0 16px}
table.stats{border-collapse:collapse;margin:0 0 22px;font-size:13px;
  font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
table.stats th{text-align:right;font-weight:600;color:var(--ink-3);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;padding:9px 13px;border-bottom:1px solid var(--line)}
table.stats td{text-align:right;padding:8px 13px;border-bottom:1px solid var(--line)}
table.stats tr:last-child td{border-bottom:none}
table.stats td.rung,table.stats th:first-child{text-align:left;font-weight:600;color:var(--ink)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.keygrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
figure.big figcaption{padding:16px 18px 20px}
figure.big figcaption b{font-size:17px;letter-spacing:-.01em;margin-bottom:6px}
figure.big figcaption span{font-size:14px;line-height:1.5}
section.key h2::before{background:var(--ink)}
details{margin-top:6px}
details>summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:9px 14px;
  border:1px solid var(--line);border-radius:999px;display:inline-block;
  background:var(--card);list-style:none;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--ink-3)}
details[open]>summary::before{content:"▾ "}
details>summary:hover{color:var(--ink)}
details>.grid{margin-top:18px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
figure img{width:100%;display:block;background:#fff;cursor:zoom-in}
figcaption{padding:13px 15px 15px}
figcaption b{display:block;font-size:14px;margin-bottom:3px}
figcaption span{color:var(--ink-2);font-size:13px}
.empty{color:var(--ink-3);font-style:italic;padding:14px 0}
dialog{border:none;background:transparent;max-width:96vw;max-height:96vh;padding:0}
dialog::backdrop{background:rgba(10,10,12,.86)}
dialog img{max-width:96vw;max-height:88vh;background:#fff;border-radius:8px;display:block}
dialog .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
  color:#e9e9ea;font-size:13px;padding:10px 4px}
dialog button{font:inherit;background:transparent;border:1px solid #55585e;color:#e9e9ea;
  border-radius:8px;padding:4px 11px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){figure{transition:transform .12s ease}
  figure:hover{transform:translateY(-1px)}}

.sheet{max-width:1180px;margin:0 auto;padding:0 18px 64px}
.pf{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);margin:0 0 26px;padding:18px 18px 14px}
.pf .plate{background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:10px;display:flex;justify-content:center}
.pf img{display:block;height:auto;image-rendering:auto}
.pf .meta{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;flex-wrap:wrap}
.pf .num{font-weight:700;color:var(--ink)}
.pf .w{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pf .w code{background:var(--ground);padding:1px 6px;border-radius:4px}
.pf figcaption{margin:12px 2px 0;color:var(--ink-2);font-size:14.5px;line-height:1.55}
.pf figcaption b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pf .plate{background:#f7f7f5}}
:root[data-theme="dark"] .pf .plate{background:#f7f7f5}
</style><header class="top"><h1>Paper figures</h1><span class="sub">the shortlist that goes in the report, shown at the width it prints at — 3.5 in for a column, 6.5 in for full width. No figure carries a title: the caption is the title.</span></header><main class="sheet"><figure class="pf"><div class="meta"><span class="num">Fig. 1</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_trochoidal_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_trochoidal_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 1" style="width:100.0%;max-width:975px" src="paper/fig_trochoidal_design.png"></div><figcaption><b>Fig. 1.</b> Designed against flown position for the trochoidal law, over the first 20 s of each flight, at four of the eight gain rungs. Grey is the same configuration in the noiseless simulator, started from where the drones actually were when the algorithm engaged; colour is VICON. At k·τ 0.56 and 0.84 the aircraft sits on the designed pattern. At 1.12 a ripple appears on top of it and does not decay, and at 3.92 the pattern is barely visible beneath it. The loops in the left-hand panels have a period of about 1.1 s at every rung, set by the loop delay rather than by the gain.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 2</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_trochoidal_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_trochoidal_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 2" style="width:53.8%;max-width:525px" src="paper/fig_noise_trochoidal_box.png"></div><figcaption><b>Fig. 2.</b> Deviation from the designed trochoidal pattern against injected position noise, at β = 2 where the gain ladder is quiet, so the exact-state assumption is probed on its own. Box is the middle half of the flight, whiskers the 5th to 95th percentile. Every other parameter is identical across the four flights.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 3</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_coverage_converge.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_coverage_converge.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 3" style="width:100.0%;max-width:975px" src="paper/fig_coverage_converge.png"></div><figcaption><b>Fig. 3.</b> What the coverage law converged to, on the quiet rung (k·τ 0.34). Left is the moment the algorithm engaged, right is 77 s later; both panels show the region Q, the Voronoi partition built from the flown positions, each agent (dot) joined to its own cell’s centroid (cross), and the Gaussian density at one and two sigma. The law’s fixed points are exactly the configurations where every agent sits on its own centroid, so the length of those joining lines is the convergence being claimed. The partition is built with the same half-plane clip the controller uses, so the drawn cells are the cells the cost was scored on.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 4</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_coverage_promise.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_coverage_promise.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 4" style="width:100.0%;max-width:975px" src="paper/fig_coverage_promise.png"></div><figcaption><b>Fig. 4.</b> The quantity the coverage result is stated in — the locational cost H — over the three gain settings, against the same configuration in the noiseless simulator. The density is a Gaussian hotspot orbiting once every 20.9 s, so H is a tracking cost rather than a settling one, and the slow undulation in both traces is one orbit of that hotspot. The first 5 s are cut: the fleet starts from its parked marks and that one-off fan-out is three times the size of everything after it. After the first 20 s the hardware median reads 0.147, 0.117 and 0.124 against 0.164, 0.122 and 0.112 in simulation — within 0.017 on every rung. At k·τ 1.01 the aircraft is visibly oscillating (next figure) and a fast ripple appears on H, but its median moves by 0.007. The metric the theorem is written in barely registers a ladder that changes how the drones fly by a factor of five.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 5</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_coverage_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_coverage_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 5" style="width:100.0%;max-width:975px" src="paper/fig_coverage_design.png"></div><figcaption><b>Fig. 5.</b> Designed against flown position for Voronoi coverage at three gain settings, 20 s from the middle of each flight. The label in each right panel is the median distance between the two lines over that window.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 6</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_coverage_benchmarks.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_coverage_benchmarks.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 6" style="width:100.0%;max-width:975px" src="paper/fig_coverage_benchmarks.png"></div><figcaption><b>Fig. 6.</b> Coverage under injected position noise. Top row: how the aircraft flew. Deviation and oscillation are computed from the recorded position, which carries the injected noise, so each bar is shown against a sensor-only null — the control flight re-measured through that rung’s noise. Tilt comes from the motion-capture pose stream, which the injection never touches. Bottom row: the three quantities the coverage result is stated in. All three span a few percent of their own mean across a ladder that moves the aircraft by a factor of five.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 7</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_coverage_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_coverage_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 7" style="width:53.8%;max-width:525px" src="paper/fig_noise_coverage_box.png"></div><figcaption><b>Fig. 7.</b> Deviation from the designed coverage configuration against injected position noise. Box is the middle half of the flight, whiskers the 5th to 95th percentile, line the median. Median deviation runs 3.5, 6.4, 5.8, 8.3 and 13.3 cm. Every parameter other than the noise level is identical across the five flights.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 8</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_flocking_converge.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_flocking_converge.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 8" style="width:100.0%;max-width:975px" src="paper/fig_flocking_converge.png"></div><figcaption><b>Fig. 8.</b> What the flocking law converged to, on the quiet rung (k·τ 0.42). Left is the moment the algorithm engaged: the four agents sit on their parked marks, every pair further apart than the 0.84 m sense range, so no edge exists and there is no group. Right is 125 s later: a connected lattice at 0.59 m spacing that has also travelled to follow the moving γ-agent. Both panels are drawn at the same scale. The edges are not scored good or bad here, because the α-lattice does not settle at the nominal spacing d = 0.70 m — the sigma-norm bump puts its equilibrium at about 0.84 d = 0.59 m, which is what the flight reached.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 9</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_flocking_promise.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_flocking_promise.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 9" style="width:100.0%;max-width:975px" src="paper/fig_flocking_promise.png"></div><figcaption><b>Fig. 9.</b> Lattice error — the RMS gap between every in-range pair and the nominal spacing — across the three time-rescalings, hardware against the same configuration in simulation. On the quiet rung the two agree to 0.1 mm (0.1083 m against 0.1084 m). The residual 10.8 cm is not a hardware error: the recorder scores against the nominal d = 0.70 m while the α-lattice equilibrium is at about 0.59 m, and the simulation carries the same offset. At k·τ 1.25 the trace is visibly noisier throughout and breaks away near the end of the flight.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 10</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_flocking_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_flocking_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 10" style="width:100.0%;max-width:975px" src="paper/fig_flocking_design.png"></div><figcaption><b>Fig. 10.</b> Designed against flown position for Olfati-Saber flocking at three time-rescalings, 20 s from the middle of each flight. The rescaling leaves the lattice and the path unchanged and moves only the rate at which the law acts, so k·τ is the only quantity that differs between rows.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 11</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_flocking_benchmarks.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_flocking_benchmarks.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 11" style="width:100.0%;max-width:975px" src="paper/fig_flocking_benchmarks.png"></div><figcaption><b>Fig. 11.</b> Flocking under injected position noise. Top row: how the aircraft flew — deviation 5.2 → 11.1 cm, oscillation 0.47 → 1.24 cm, median tilt 1.4 → 2.1°. Bottom row: the properties the flocking result is stated in — cohesion, safety and connectivity. Lattice error spans 7% of its mean, the smallest pair gap 3%, and the graph is connected on 99.3% of ticks at every rung. The velocity-matching metric is left out: it reads the least-squares velocity, where the fit has already multiplied the injected position noise by about eleven, so its rise is the injection and not the flock.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 12</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_flocking_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_flocking_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 12" style="width:53.8%;max-width:525px" src="paper/fig_noise_flocking_box.png"></div><figcaption><b>Fig. 12.</b> Deviation from the designed flocking lattice against injected position noise. Median deviation runs 5.1, 4.5, 8.2 and 9.1 cm. The control reads above the 2 mm rung; both of those conditions were flown twice and reproduce to within 0.3 cm, so the ordering is a property of the ladder rather than a bad flight.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 13</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_kuramoto_converge.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_kuramoto_converge.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 13" style="width:100.0%;max-width:975px" src="paper/fig_kuramoto_converge.png"></div><figcaption><b>Fig. 13.</b> The Kuramoto ring on the quiet rung (k·τ 0.39), at engage and 74 s later. Unlike the other four laws the formation is also the starting condition — the drones take off onto marks that already lie on the 0.65 m ring — so what the hardware tests is whether the ring is maintained, not whether it is reached, and the transient is correspondingly small: the order parameter runs 0.9994 at engage to 1.0000 settled, the radial error off the ring 2.6 cm to 0.6 cm, and the angular spacing error 0.059 to 0.033 rad. Phase lock is therefore not evidence of much on this ladder — it was nearly perfect before the law did anything.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 14</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_kuramoto_promise.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_kuramoto_promise.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 14" style="width:100.0%;max-width:975px" src="paper/fig_kuramoto_promise.png"></div><figcaption><b>Fig. 14.</b> The order parameter R, the quantity the Kuramoto result is stated in, across the damping ladder. R reads 1.0000, 0.9909 and 0.9962 settled, against 1.0000 in simulation on every rung — within 0.3% of the ideal across a ladder that puts the aircraft into 21 cm of sustained oscillation at 29° of bank with the acceleration clamp active on 80% of ticks. The excursion at the end of the middle panel is the end of the flight, not the law. A phase-only metric cannot see a position oscillation, which is the sharpest case of metric blindness in the set.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 15</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_kuramoto_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_kuramoto_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 15" style="width:100.0%;max-width:975px" src="paper/fig_kuramoto_design.png"></div><figcaption><b>Fig. 15.</b> Designed against flown position for the Kuramoto ring formation at three damping settings, 20 s from the middle of each flight. Only the own-velocity gain differs between rows; the ring the law asks for is identical. The smallest pair gap falls from 0.90 m to 0.63 m across these rungs and the angular spacing error from 0.033 to 0.53 rad — the ring deforms badly — while R stays within 0.3% of 1 throughout.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 16</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_kuramoto_benchmarks.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_kuramoto_benchmarks.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 16" style="width:100.0%;max-width:975px" src="paper/fig_kuramoto_benchmarks.png"></div><figcaption><b>Fig. 16.</b> Kuramoto under injected position noise. Top row: how the aircraft flew. Tilt is absent because the Kuramoto recorder writes its own metric columns only and never the pose stream, so this law has no clean motion channel. Bottom row: the four properties the law promises. R is flat at 1.0000 across the whole ladder, while the radial error off the ring spans 42% of its mean and the angular spacing error 53%. Phase lock holds; the geometry it is supposed to produce does not.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 17</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_kuramoto_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_kuramoto_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 17" style="width:53.8%;max-width:525px" src="paper/fig_noise_kuramoto_box.png"></div><figcaption><b>Fig. 17.</b> Deviation from the designed ring for the Kuramoto law against injected position noise. Median deviation runs 12.0, 12.3, 11.8 and 12.1 cm — flat across the whole ladder, against a baseline gap of 12 cm. Under the same lever the trochoidal and coverage ladders move by a factor of four to five.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 18</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_distance_converge.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_distance_converge.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 18" style="width:100.0%;max-width:975px" src="paper/fig_distance_converge.png"></div><figcaption><b>Fig. 18.</b> What the distance-based formation converged to, on the quiet rung (k·τ 0.39). Left is the moment the algorithm engaged, right is 54 s later; the drawn graph is the octahedron’s twelve constraint edges, orange where an edge is more than 30% off its target length. Three edges start out of tolerance and the hexagon is visibly skewed; by 54 s every edge is within tolerance. The edge-length error falls from 8.9 cm to 0.6 cm and the Lyapunov function W from 0.128 to 0.001 over the same window. Both panels are drawn at the same scale.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 19</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_distance_promise.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_distance_promise.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 19" style="width:100.0%;max-width:975px" src="paper/fig_distance_promise.png"></div><figcaption><b>Fig. 19.</b> Edge-length error, the quantity the distance-formation result is stated in, across the damping ladder. At k·τ 0.39 the error settles at 0.6 cm against 0.1 cm in simulation; at 0.81 it holds at 10.7 cm, 27 times the simulated value, and at 1.20 at 10.0 cm, 17 times. Unlike coverage’s H and Kuramoto’s R, this metric is a direct function of the positions, so it registers the oscillation the aircraft is actually doing.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 20</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_distance_design.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_distance_design.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 20" style="width:100.0%;max-width:975px" src="paper/fig_distance_design.png"></div><figcaption><b>Fig. 20.</b> Designed against flown position for the distance-based formation at three damping settings, 20 s from the middle of each flight. The law holds a six-agent octahedron by inter-agent distances alone, with one real aircraft. At k·τ 0.39 the drone sits on its station, 1 cm from where the law wanted it. At 0.81 it circles a 26 cm orbit around that station and at 1.20 a 40 cm one, at about 1.1 s per lap in both cases. Only the damping gain differs between rows; the commanded shape is identical.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 21</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_distance_benchmarks.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_distance_benchmarks.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 21" style="width:100.0%;max-width:975px" src="paper/fig_distance_benchmarks.png"></div><figcaption><b>Fig. 21.</b> Distance-based formation under injected position noise. Top row: how the aircraft flew. Bottom row: the three quantities the formation result is stated in — the edge-length error the theorem bounds, the shape error after a best rigid fit, and the Lyapunov function the convergence proof is built on. Unlike coverage, whose published quantities stay within a few percent of their mean across the same lever, all three move with the noise: the edge error by 54% of its mean, the shape error by 51%, and W by 133%. A shape defined by distances is a direct function of the positions the noise corrupts, so its metric cannot be blind to it.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 22</span><span class="w">3.5 in &nbsp;·&nbsp; <code>fig_noise_distance_box.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_noise_distance_box.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 22" style="width:53.8%;max-width:525px" src="paper/fig_noise_distance_box.png"></div><figcaption><b>Fig. 22.</b> Deviation from the designed octahedron against injected position noise, flown at k·τ 0.39 where the gain ladder is quiet. Median deviation runs 1.2, 2.4, 2.7 and 3.6 cm.</figcaption></figure><figure class="pf"><div class="meta"><span class="num">Fig. 23</span><span class="w">6.5 in &nbsp;·&nbsp; <code>fig_cross_noise.pdf</code> &nbsp;·&nbsp; <a href="paper/fig_cross_noise.pdf">vector</a></span></div><div class="plate"><img loading="lazy" alt="Figure 23" style="width:100.0%;max-width:975px" src="paper/fig_cross_noise.png"></div><figcaption><b>Fig. 23.</b> All five control laws under the same lever. Deviation from the designed trajectory is the only quantity every law records, so it is the only axis the five can share — each law’s own promise metric is in different units and measures a different property. Left, in centimetres: the baselines differ by a factor of nine, from 1.4 cm for the distance formation to 13.4 cm for Kuramoto, and that offset buries the slopes. Right, each law divided by its own 0 mm flight. Over 0 to 10 mm the trochoidal law rises 5.7×, the distance formation 3.0×, coverage 2.9× and flocking 2.1×, while Kuramoto ends at 0.99× — flat. Kuramoto’s flatness is not robustness: its 10 mm flight sits at 0.99 times its own sensor-only null, so the whole ladder is inside the gap the law already had. Coverage was the only law taken to 20 mm; the rungs are placed evenly rather than to scale. No null is drawn: the trochoidal ladder was flown before the null model existed, and a reference line present for four series and missing for the fifth would read as a difference between the laws rather than between the ladders.</figcaption></figure></main></body></html>
