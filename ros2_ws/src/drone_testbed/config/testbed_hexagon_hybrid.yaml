# Distance-based formation control, hybrid: two real drones flying the hexagon
# alongside four simulated ones.
#
# Same trick as testbed_flocking_hybrid.yaml -- nothing in the stack knows which
# drones are real. Every drone publishes /<id>/state; for a real one that comes
# from mocap_state_node reading VICON, for a virtual one from drone_node
# integrating the dynamics. algorithm_manager subscribes to all six and cannot
# tell them apart, so the real drones genuinely react to the virtual ones and
# back.
#
# Differs from testbed_hexagon.yaml (the desk sim) in three ways, all forced by
# the lab: the shape is bigger so the two real aircraft stay further apart, the
# start is a scatter around the target rather than a clump at the origin so the
# transient stays inside the geofence, and drone1 is anchored.
#
# Launch:
#   ros2 launch drone_testbed hardware_hybrid.launch.py \
#       config:=config/testbed_hexagon_hybrid.yaml \
#       hw_drone:=drone1,drone4 cf_name:=drone_1,drone_4 \
#       mocap_name:=drone_1,drone_4

simulation:
  dt: 0.1
  control_rate: 10.0
  sim_rate: 10.0
  # Same box the real drones are geofenced to, so a virtual agent cannot lead a
  # real one somewhere it would be aborted for following.
  bounds: 1.5

# PLACE THE REAL DRONES ON THESE MARKS before launching. For a virtual drone the
# position below is what it starts from; for a real one mocap decides where it
# actually is, but the whole envelope below was sized assuming it starts here.
#
# drone1 and drone4 are the real pair, and they are OPPOSITE vertices of the
# target hexagon -- 1.4 m apart at rest, and never closer than 1.32 m at any
# point in the transient. They are also the two airframes already configured in
# config/crazyflies.yaml, so hw_drone, cf_name and mocap_name line up without a
# cross-mapping.
#
# The scatter is not decoration. A neat ring start is ALREADY a hexagon and only
# needs rescaling, which tests almost nothing; these marks start 0.26 m of shape
# error away from the target, so the formation genuinely has to form. They are
# also asymmetric on purpose, for the reason given in testbed_flocking_hybrid:
# a symmetric start is an equilibrium the law has no reason to leave, and mocap
# noise will break it at an unpredictable moment mid-flight.
drones:
  - id: "drone1"          # REAL. Settles on the +x vertex (it is the anchor).
    initial_position: [0.59, -0.19]
    initial_velocity: [0.0, 0.0]
    role: "leader"
  - id: "drone2"          # virtual
    initial_position: [0.17, 0.90]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone3"          # virtual
    initial_position: [-0.24, 0.17]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone4"          # REAL. Settles on the -x vertex, opposite drone1.
    initial_position: [-0.93, -0.06]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone5"          # virtual
    initial_position: [-0.58, -0.68]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone6"          # virtual
    initial_position: [0.34, -0.95]
    initial_velocity: [0.0, 0.0]
    role: "follower"

# Predicted envelope from the marks above, measured over 120 s in simulation:
#
#   settles (edge rms < 1 cm)          6.8 s
#   final shape error                  0.04 mm after a rigid fit; not mirrored
#   peak speed                         0.465 m/s   (clamp 0.7)
#   max radius from origin             1.006 m -> 0.49 m margin to the 1.5 m
#                                      geofence, 0.79 m to the 1.8 m abort
#   closest approach, ANY pair         0.521 m
#   closest approach, drone1-drone4    1.323 m   <- THE TWO REAL AIRCRAFT
#
# Final resting places:
#   drone1 [+0.700, -0.000]   drone2 [+0.313, +0.583]   drone3 [-0.386, +0.540]
#   drone4 [-0.698, -0.087]   drone5 [-0.311, -0.670]   drone6 [+0.388, -0.627]
#
# TOLERANCE TO PLACEMENT ERROR. Over 30 trials with every drone displaced by up
# to +/-8 cm:
#   worst closest approach, any pair   0.385 m  (both virtual)
#   worst drone1-drone4 separation     1.207 m
#   worst max radius                   1.157 m
#   worst peak speed                   0.551 m/s
#   worst shape error                  0.17 mm
#   mirrored outcomes                  0 of 30
# So the guaranteed floor between the two aircraft is about 1.2 m. That is far
# more margin than flocking gives, because here the two real drones are pinned
# to opposite vertices of a rigid shape rather than to whichever lattice site
# they happen to fall into. Keep the launch file's altitude stagger anyway: the
# law is 2D and knows nothing about rotor extent or downwash.
#
# SATURATION IS THE THING TO WATCH ON THIS ALGORITHM. Peak acceleration DEMAND
# from these marks is 2.43 m/s^2 against a 0.5 clamp, so the transient runs
# nearly 5x over the limit and 0.4% of agent-ticks come back clipped. The cause
# is structural, not a bad gain: each edge contributes |r^2 - d^2| * r, which
# grows like r^3, where consensus and leader-follower are linear and flocking's
# action function is bounded by construction. This is the algorithm in the
# testbed that stresses the max_accel simplification hardest, and the clipping
# is confined to the transient -- once near the shape, r ~ d and demand
# collapses. Predict accordingly (docs/PROJECT_AIM.md s10): the shape should
# still converge, because saturation delays gradient descent without reversing
# it, but the CENTROID should drift, since clipping breaks the pairwise force
# cancellation that pins it.
#
# Simulation from these marks separates the three contributions cleanly, and
# the separation is worth quoting in full because the headline number is mostly
# not what it looks like:
#
#   anchor off, clamp off    0.00 cm   the invariance, exactly as predicted
#   anchor off, clamp on     2.97 cm   pure gap A -- this is the saturation
#   anchor on,  clamp on    14.25 cm   what this config actually flies
#
# So of the 14.25 cm, about 3 cm is the acceleration clamp and the rest is the
# anchor deliberately pulling drone1 onto its vertex. Only the middle row is a
# result about the algorithm; the bottom row is a result about our harness. Any
# lab measurement in excess of 14.25 cm is gap B and attributable to the
# physical layer -- and if the centroid invariance is what you actually want to
# measure, fly it with anchor: [] and accept the geofence risk.
algorithm:
  name: "DistanceFormation"
  params:
    side_length: 0.7         # 0.6 in the desk sim; opened up so the two real
                             # drones rest 1.4 m apart instead of 1.2 m.
    formation_center: [0.0, 0.0]
    formation_rotation: 0.0

    topology: "octahedron"   # globally rigid; see testbed_hexagon.yaml for the
                             # measured comparison against the alternatives

    gain_kp: 0.45            # 0.6 in the desk sim. Backed off because the
                             # scatter starts further from the target and the
                             # force is cubic in the error: kp 0.6 from these
                             # same marks demands 3.25 m/s^2 and clips 0.6% of
                             # ticks, against 2.43 and 0.4% here.
    gain_kv: 1.2
    max_accel: 0.5

    # HARNESS ADDITION -- declare it as one in the writeup. The published law
    # has no absolute-position term at all, and with anchor: [] the hexagon is
    # free to translate, which in a 1.5 m geofence is not acceptable: a start
    # only 0.9 m from the target converged 0.84 m off-centre in testing and put
    # an agent 1.73 m out, past the abort radius.
    #
    # It also costs about 11 cm of centroid offset by itself -- see the
    # decomposition above -- so it is not free even when it works.
    #
    # drone1 alone is anchored, which is the smallest violation that fixes it:
    # ONE agent needs global position, the other five stay purely range-based,
    # and the graph is otherwise untouched. Rotation is still free -- the
    # hexagon can settle at any angle about drone1's anchor point -- so the
    # distance-based character of the other five is intact.
    #
    # Anchoring a SECOND agent would pin rotation and handedness too, and at
    # that point it is no longer meaningfully a distance-based formation. Do
    # not do it to make a plot look tidier.
    anchor: ["drone1"]
    anchor_gain_kp: 0.4
    anchor_gain_kd: 0.0
