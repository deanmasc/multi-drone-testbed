# ============================================================================
# Kuramoto, natural-frequency spread rung w045  (omega_max - omega_min = 0.45)
# ============================================================================
# Generated 2026-10-07. Derived from testbed_kuramoto_delay_000ms.yaml with ONE
# change: `omega` becomes a per-agent mapping instead of a single scalar.
#
# WHY. Schmidt, Papachristodoulou, Muenz & Allgoewer, Automatica 48 (2012)
# 3008-3017, eq. (2). Their whole analysis is about NON-IDENTICAL oscillators:
# eq. (10) shows that with identical natural frequencies phase agreement is
# trivial, and the quantity that enters their stability bound is the spread
# omega_max - omega_min. With a single scalar omega every oscillator sees the
# same phase bias, so nothing can desynchronise -- verified in simulation out
# to 2 s of coupling delay, where order_R stayed at 1.0000 and the delay only
# shifted the agreement frequency via their self-consistency condition eq. (9).
# This ladder switches that degeneracy off.
#
# The spread is the ONLY thing that changes across the ladder. phase_gain
# (= the paper's coupling gain K) is 0.25 in every rung, as are every harness
# gain, the radius, the topology and the rate -- so nothing we wrote varies.
#
# ASSIGNMENT. drone1 is the real aircraft and takes an INTERIOR frequency
# (0.275 rad/s here), never the extreme, so it never slows to a stop or
# reverses. The extremes go to virtual agents.
#
# SIMULATED PREDICTION for this rung (250 s, settled tail):
#   order_R 0.9377   max frequency drift 0.0000 rad/s   -> synchronised
#   smallest pair gap 0.58 m, max radius <= 0.70 m against a 1.5 m geofence
#
# ONE REAL DRONE ONLY. At the top rung the oscillators drift apart and agents
# pass each other on the ring, so the smallest pair gap reaches 0. With a
# single real aircraft every such pass is real-against-virtual and harmless.
# Do not fly this ladder with two real drones.
# ============================================================================

simulation:
  dt: 0.05
  control_rate: 20.0
  sim_rate: 20.0
  bounds: 1.5
drones:
- id: drone1
  initial_position:
  - 0.65
  - 0.0
  initial_velocity:
  - 0.0
  - 0.0
- id: drone2
  initial_position:
  - -0.25312
  - 0.59869
  initial_velocity:
  - 0.0
  - 0.0
- id: drone3
  initial_position:
  - -0.62979
  - 0.16081
  initial_velocity:
  - 0.0
  - 0.0
- id: drone4
  initial_position:
  - 0.12914
  - -0.63704
  initial_velocity:
  - 0.0
  - 0.0
algorithm:
  name: KuramotoPhaseDelay
  params:
    center:
    - 0.0
    - 0.0
    radius: 0.65
    omega:                        # per-agent, Automatica 48 (2012) eq. (2)
      drone1: 0.275000
      drone2: 0.125000
      drone3: 0.425000
      drone4: 0.575000
    phase_gain: 0.25
    tracking_phase_gain: 0.4
    position_gain: 1.0
    formation_gain: 0.8
    velocity_gain: 1.0
    max_accel: 3.5
    initialize_from_state: true
    initial_phases:
      drone1: 0.0
      drone2: 1.9707963268
      drone3: 2.8915926536
      drone4: 4.9123889804
    adjacency:
      drone1:
        drone2: 1.0
        drone4: 1.0
      drone2:
        drone1: 1.0
        drone3: 1.0
      drone3:
        drone2: 1.0
        drone4: 1.0
      drone4:
        drone1: 1.0
        drone3: 1.0
    mocap_noise: 0.0
    phase_delay_ms: 0
