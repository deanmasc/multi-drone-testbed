# VARIANT of testbed_coverage_c2.yaml: HOTSPOT SPEED ladder, 0.9 rad/s
# (docs/LAB_PLAN_2026-09-22.md). The gains are c2's, UNCHANGED:
#   gain_kp 4.0, gain_kd 2.4  ->  k x tau = 2.4 x 0.28 = 0.67
#
# WHAT THIS LADDER CHANGES, AND WHY IT IS NOT THE SPEED LADDER AGAIN. The speed
# ladder (c1/c2/c3) changed the CONTROLLER, which moved k x tau and therefore
# the delay margin -- c3 at 1.01 oscillated at 23 cm. This ladder changes the
# PROBLEM and leaves the controller alone: kp, kd and k x tau are identical to
# c2's on every rung. Only the density moves faster.
#
# The assumption under attack is Lloyd/Cortes coverage's STATIC DENSITY. Ours
# already moves at 0.3 rad/s, which is why the fleet never quite settles; this
# asks what happens as the target outruns them.
#
#   hotspot_speed  0.9 rad/s  ->  7.0 s per orbit, 0.54 m/s tangential
#
# PREDICTION. H rises smoothly above the Lloyd optimum and the distance from
# the designed position grows roughly as speed x 0.28 s -- 4.5 cm at c2's
# 0.16 m/s, ~15 cm here. If the design gap grows on that slope, the delay
# explains the whole degradation; if it grows faster, something else is also
# breaking, which is the more interesting outcome.
#
# WATCH THE CLIPPED-TICKS NUMBER. The delay limit cycle cannot be reached by
# this lever -- k x tau does not move -- but there is one indirect route:
# chasing a faster target means larger position errors, so kp x error grows,
# and if the command starts hitting the 3.5 m/s^2 clamp then saturation lowers
# the effective gain and can trip the oscillation anyway. If clipping leaves
# 0%, the run is no longer a clean single-variable test. Do not climb further.
#
# Two hard ceilings on this lever: crazyflie_node caps the setpoint speed at
# 0.7 m/s, and the drones' own speed scales with the hotspot's. 0.9 rad/s is
# about as far as this arena goes.
#
# FLOWN WITH ONE REAL DRONE: drone1 (VICON drone_1) on (-0.25, -0.20);
# drone2, drone3 and drone4 are simulated and carry no delay, which makes them
# the control group inside the same flight.
#
#   ros2 launch drone_testbed hardware_hybrid.launch.py \
#     config:=config/testbed_coverage_c2_h09.yaml \
#     hw_drone:=drone1 cf_name:=drone_1 mocap_name:=drone_1 \
#     flight_duration:=90.0

simulation:
  dt: 0.1
  control_rate: 10.0
  sim_rate: 10.0
  # Same box the real drones are geofenced to. A virtual agent clamped here
  # cannot lead a real one out of the capture volume.
  bounds: 1.5

# PLACEMENT. For a virtual drone the position below is its start. For a real one
# mocap decides where it actually is -- and because Coverage is reactive
# (acceleration only, no explicit setpoint) it is lunge-free from anywhere, so
# exact placement does not matter the way it does for the trajectory algorithms.
# Put the real drone(s) roughly on their marks and inside the region; the
# Voronoi law takes it from there.
#
# The four start clustered near the origin, biased slightly toward their target
# quadrants so the assignment is deterministic across runs. From a clump they
# fan out and settle at the four quadrant centres (+/-0.667, +/-0.667) -- the
# centroidal Voronoi configuration for a square. Watching the clump become an
# even partition is the demo.
#
# drone1 and drone2 are placed so they settle on OPPOSITE corners (the long
# 1.884 m diagonal, the furthest-separated pair) and are the two airframes
# already in config/crazyflies.yaml, so hw_drone / cf_name / mocap_name line up
# with no cross-mapping.
drones:
  - id: "drone1"          # THE ONLY REAL DRONE in this ladder. Settles bottom-left.
    initial_position: [-0.25, -0.20]
    initial_velocity: [0.0, 0.0]
    role: "leader"
  - id: "drone2"          # virtual here (real only if you fly two). Settles top-right.
    initial_position: [0.22, 0.26]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone3"          # virtual. Settles bottom-right.
    initial_position: [0.28, -0.24]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone4"          # virtual. Settles top-left.
    initial_position: [-0.20, 0.30]
    initial_velocity: [0.0, 0.0]
    role: "follower"

# Predicted steady state from the starts above, measured in sim over 200 s:
#
#   final positions        (+/-0.667, +/-0.667), one per quadrant
#   drone1-drone2  1.884   <- long diagonal: the two real drones
#   drone3-drone4  1.884   <- other diagonal, both virtual
#   adjacent pairs 1.333
#   max centroid error at rest   ~0 m  (a true centroidal Voronoi config)
#
#   closest approach any pair over the run   0.42 m  (drone2-drone4, real vs
#       virtual, during the fan-out -- virtual drones have no rotor extent)
#   closest the two REAL drones ever come    0.66 m  (they start ~0.6 m apart
#       and only move apart toward opposite corners)
#   furthest any drone from the origin       1.00 m  -> 0.5 m margin to the
#       1.5 m geofence, 0.8 m to the 1.8 m abort boundary
#   settle time    ~6.7 s to max drone speed < 1 cm/s
#   peak speed     0.31 m/s during the fan-out, near zero once settled
#   peak accel     saturates the 0.5 clamp briefly during the fan-out only
#
# The 2D law has no knowledge of rotor extent, so keep the launch file's
# altitude stagger (height_step, 0.4 m) when flying two real drones.
#
# ONE REAL DRONE: just set hw_drone:=drone1. With three virtual neighbours it
# gets a real Voronoi cell and settles at its quadrant centre.
#
# Launch (after `ros2 launch crazyflie launch.py backend:=cflib` in another
# terminal):
#   one real drone
#     ros2 launch drone_testbed hardware_hybrid.launch.py \
#         config:=config/testbed_coverage_hybrid.yaml \
#         hw_drone:=drone1 cf_name:=drone_1 mocap_name:=drone_1
#   two real drones
#     ros2 launch drone_testbed hardware_hybrid.launch.py \
#         config:=config/testbed_coverage_hybrid.yaml \
#         hw_drone:=drone1,drone2 cf_name:=drone_1,drone_2 \
#         mocap_name:=drone_1,drone_2
algorithm:
  name: "Coverage"
  params:
    region_half_width: 1.3   # < geofence (1.5) for margin. Square region Q.
    gain_kp: 4.0             # pull to cell centroid  (c^2 x 1.0, c = 2)
    gain_kd: 2.4             # velocity damping      (c x 1.2, c = 2)
    max_accel: 3.5           # same clamp on every rung, so only speed differs
    grid_res: 36             # density-integral samples per axis, per cell

    # Moving region of interest: the fleet must keep chasing it, so H stays a
    # live tracking error instead of settling once and sitting still.
    density: "gaussian"
    hotspot_center: [0.0, 0.0]
    hotspot_sigma: 0.4
    hotspot_speed: 0.9        # rad/s -> 7.0 s per orbit, 0.54 m/s tangential (c2 baseline: 0.3)
    hotspot_orbit_radius: 0.6

    # --- Moving-hotspot tracking sweep: uncomment to make the fleet chase an
    # --- orbiting region of interest instead of holding an even partition.
    # --- Required tangential speed to keep up is ~hotspot_orbit_radius *
    # --- hotspot_speed; pick values well under max_vel (0.7 m/s) to see clean
    # --- tracking, and up near it to find where the lag actually shows up.
    # density: "gaussian"
    # hotspot_center: [0.0, 0.0]
    # hotspot_sigma: 0.4        # < region_half_width margin
    # hotspot_speed: 0.15       # rad/s; 0 = stationary. ~0.06 m/s required here
    # hotspot_orbit_radius: 0.6 # m, stays inside the 1.3 m region

    # Cost-history log for the writeup: H(p) across the real+virtual fleet.
    # "" = timestamped file in the launch directory.
    # log_file: ""
    # log_interval: 0.5
