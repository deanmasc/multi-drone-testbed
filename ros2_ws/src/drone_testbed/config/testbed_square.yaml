simulation:
  dt: 0.1
  control_rate: 10.0   # Hz -- faster than PrintState; this one actually moves
  sim_rate: 10.0
  bounds: 2.0

drones:
  - id: "drone1"
    initial_position: [0.0, 0.0]
    initial_velocity: [0.0, 0.0]
    role: "leader"

# A 2m square at 0.25 m/s: 8s per side, 32s for a full lap. Pass
# flight_duration:=36 or more, or the run lands partway round.
#
# The square starts at the drone's position when the algorithm begins and
# extends +x and +y from there, so [x0, x0+2] x [y0, y0+2] must fit inside the
# flight volume -- start the drone in a corner, not the middle. The setpoint is
# also geofenced in crazyflie_node (default +/-1.5m about the world origin),
# which will clip a 2m square; raise it with geofence:= to suit the volume.
algorithm:
  name: "Square"
  params:
    side: 2.0          # m
    speed: 0.25        # m/s -- 0.15 makes a 2m lap take 53s, longer than the
                       # battery comfortably allows
    start_delay: 3.0   # s of hover before moving, lets takeoff settle
    gain_kp: 1.0
    gain_kd: 0.6
    max_accel: 0.3     # m/s^2
    # Flight log for judging path quality after the fact. Empty log_file puts a
    # timestamped file in whatever directory you launched from, so runs never
    # overwrite each other. log_interval cannot resolve finer than the control
    # period above (0.1s at control_rate 10.0).
    log_file: ""
    log_interval: 0.1  # s
