simulation:
  dt: 0.1
  control_rate: 10.0   # Hz -- faster than PrintState; this one actually moves
  sim_rate: 10.0
  bounds: 2.0

drones:
  # Simulation only -- on hardware the start position comes from mocap, and the
  # square anchors wherever the drone physically is. Kept in step with the real
  # placement so sim and hardware sweep the same box.
  - id: "drone1"
    initial_position: [-1.0, -1.0]
    initial_velocity: [0.0, 0.0]
    role: "leader"

# A 2m square at 0.25 m/s: 8s per side, 32s for a full lap. Pass
# flight_duration:=36 or more, or the run lands partway round.
#
# The square anchors at the drone's real position when the algorithm begins and
# extends +x and +y from there -- nothing in this file sets that, it comes from
# mocap. Place the drone at (-1, -1) and the square sweeps [-1, 1] x [-1, 1],
# centred on the world origin and inside the default +/-1.5m geofence with 0.5m
# to spare. Starting near the origin instead pushes it out to (+2.06, +1.96),
# which is what tripped the geofence.
algorithm:
  name: "Square"
  params:
    side: 2.0          # m
    speed: 0.25        # m/s -- 0.15 makes a 2m lap take 53s, longer than the
                       # battery comfortably allows
    start_delay: 3.0   # s of hover before moving, lets takeoff settle
    gain_kp: 1.0
    gain_kd: 0.6
    max_accel: 0.3     # m/s^2
    # Flight log for judging path quality after the fact. Empty log_file puts a
    # timestamped file in whatever directory you launched from, so runs never
    # overwrite each other. log_interval cannot resolve finer than the control
    # period above (0.1s at control_rate 10.0).
    log_file: ""
    log_interval: 0.1  # s
