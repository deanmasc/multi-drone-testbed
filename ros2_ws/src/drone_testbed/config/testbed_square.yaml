simulation:
  dt: 0.1
  control_rate: 10.0   # Hz -- faster than PrintState; this one actually moves
  sim_rate: 10.0
  bounds: 2.0

drones:
  - id: "drone1"
    initial_position: [0.0, 0.0]
    initial_velocity: [0.0, 0.0]
    role: "leader"

# First algorithm that commands real motion. Values are deliberately timid --
# a 0.5m square at 0.15 m/s takes ~3.3s per side, 13s for a full lap. Widen
# only once a lap looks clean.
#
# The square starts at the drone's position when the algorithm begins and
# extends +x and +y from there, so confirm [x0, x0+side] x [y0, y0+side] is
# well inside the flight volume.
algorithm:
  name: "Square"
  params:
    side: 0.5          # m
    speed: 0.15        # m/s
    start_delay: 3.0   # s of hover before moving, lets takeoff settle
    gain_kp: 1.0
    gain_kd: 0.6
    max_accel: 0.3     # m/s^2
