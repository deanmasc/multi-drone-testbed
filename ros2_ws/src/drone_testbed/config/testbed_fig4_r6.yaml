# VARIANT of testbed_fig4.yaml: rescale 6, the slowest rung of the speed ladder
# (docs/PROJECT_AIM.md section 12). Identical except the gains. Every comment in
# testbed_fig4.yaml applies -- read it before flying.
#
# Design numbers (tools/design_consensus_gains.py --theta 2.28488 --rescale 6):
#   periods 63.5 s and 19.1 s, peak speed 0.080 m/s, peak accel 0.385 m/s^2,
#   envelope 0.380 m.
#   flight_duration:=205.0  (3 slow periods, plus the transient)
#
# max_accel is 3.5, the same as rescale 10 and 14, so the ladder shares one
# clamp and only the speed differs. Every earlier rescale-6 flight ran at 0.5,
# where the real drones' command was clipped on 85-96% of ticks (section 11h),
# so this is the first rescale-6 flight of the law as designed.

simulation:
  dt: 0.1
  control_rate: 10.0
  sim_rate: 10.0
  bounds: 1.5

drones:
  # Same marks as testbed_fig4.yaml. Fly drone1 and drone4 as the real pair --
  # see SEPARATION in that file.
  - id: "drone1"
    initial_position: [0.235, -0.132]
    initial_velocity: [0.0, 0.0]
    role: "leader"
  - id: "drone2"
    initial_position: [0.013, 0.070]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone3"
    initial_position: [-0.186, -0.034]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone4"
    initial_position: [0.179, 0.219]
    initial_velocity: [0.0, 0.0]
    role: "follower"

algorithm:
  name: "TrochoidalConsensus"
  params:
    alpha: 1.8231
    beta:  6.0000
    kappa: 0.3272
    theta: 2.2849
    max_accel: 3.5
    adjacency:
      drone1: {drone3: 5.0}
      drone2: {drone1: 3.0, drone3: 1.0}
      drone3: {drone1: 1.0, drone4: 2.0}
      drone4: {drone1: 1.0, drone2: 5.0}
