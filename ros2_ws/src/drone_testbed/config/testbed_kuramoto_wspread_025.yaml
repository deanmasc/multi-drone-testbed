# ============================================================================
# Kuramoto natural-frequency spread, rung w025   (omega_max - omega_min = 0.25)
# ============================================================================
# Rebuilt 2026-10-07 on testbed_kuramoto_k04.yaml -- the config that flew on
# 6 Oct -- NOT on testbed_kuramoto_delay_000ms.yaml. The first attempt used
# Tam's delay base and the drone would not move; that base differs from the
# known-good one in THREE ways at once (KuramotoPhaseDelay instead of
# KuramotoFormation, 20 Hz instead of 10 Hz, velocity_gain 1.0 instead of 1.4).
# This version changes exactly ONE thing from the flown config:
#
#   omega: 0.35  ->  a per-agent mapping with spread 0.25 rad/s
#
# Everything else -- algorithm class, 10 Hz rate, phase_gain 0.25, every
# harness gain, radius, topology, marks -- is byte-identical to the rung you
# already flew, so the ladder is comparable to it and to each other.
#
# WHY SPREAD AT ALL. Schmidt, Papachristodoulou, Muenz & Allgoewer, Automatica
# 48 (2012) 3008-3017, eq. (2). Their analysis is about NON-identical
# oscillators; eq. (10) shows identical frequencies make phase agreement
# trivial, and the spread omega_max - omega_min is what enters their bound.
# With one scalar omega nothing can desynchronise -- verified in simulation out
# to 2 s of coupling delay, order_R stayed 1.0000.
#
# drone1 is the REAL aircraft and takes an INTERIOR frequency (0.308 rad/s),
# never an extreme, so it never stalls or reverses. ONE REAL DRONE ONLY: at the
# top rung agents pass each other on the ring, which is only safe when every
# such pass is real-against-virtual.
# ============================================================================

simulation:
  dt: 0.1
  control_rate: 10.0
  sim_rate: 10.0
  bounds: 1.5
drones:
  - id: drone1
    initial_position: [0.65, 0.0]
    initial_velocity: [0.0, 0.0]
  - id: drone2
    initial_position: [-0.25312, 0.59869]
    initial_velocity: [0.0, 0.0]
  - id: drone3
    initial_position: [-0.62979, 0.16081]
    initial_velocity: [0.0, 0.0]
  - id: drone4
    initial_position: [0.12914, -0.63704]
    initial_velocity: [0.0, 0.0]
algorithm:
  name: "KuramotoFormation"
  params:
    center: [0.0, 0.0]
    radius: 0.65
    omega:                        # per-agent; Automatica 48 (2012) eq. (2)
      drone1: 0.308333
      drone2: 0.225000
      drone3: 0.391667
      drone4: 0.475000
    phase_gain: 0.25
    tracking_phase_gain: 0.4    # check actual orbital angle; slow phase when motion lags
    position_gain: 1.0
    formation_gain: 0.8
    velocity_gain: 1.4            # velocity_gain 2.0 -> 1.4, k*tau 0.39
    max_accel: 3.5            # was 0.5; matches the rest of the corpus
    mocap_noise: 0.0           # metres per axis on each REAL drone's VICON position
    initialize_from_state: true # initialize angles from the first measured states
    # Absolute angles (radians): used at the center, or when initialization from
    # state is disabled. Uneven starting gaps demonstrate synchronization.
    # Drone order assigns desired offsets 0, pi/2, pi, 3*pi/2.
    initial_phases: {drone1: 0.0, drone2: 1.9707963268, drone3: 2.8915926536, drone4: 4.9123889804}
    adjacency:
      # Same weighted-neighbor format as TrochoidalConsensus; lists also work.
      drone1: {drone2: 1.0, drone4: 1.0}
      drone2: {drone1: 1.0, drone3: 1.0}
      drone3: {drone2: 1.0, drone4: 1.0}
      drone4: {drone1: 1.0, drone3: 1.0}
