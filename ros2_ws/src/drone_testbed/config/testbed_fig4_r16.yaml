# VARIANT of testbed_fig4.yaml for next-lab test T2 (docs/PROJECT_AIM.md
# section 12). Identical except the gains: rescale 16 instead of 14. Every
# comment in testbed_fig4.yaml applies -- read it before flying.
#
# Fly this ONLY if rescale 14 still takes about one lap to double in size. It is
# the next rung of the ladder, meant to find where the point-mass model breaks.
#
# Design numbers (tools/design_consensus_gains.py --theta 2.28488 --rescale 16):
#   periods 23.8 s and 7.1 s, peak speed 0.212 m/s, peak accel 2.737 m/s^2
#   (about 16 deg of tilt), envelope 0.307 m (0.393 m with the transient).
#   flight_duration:=85.0  (3 slow periods = 71.4 s, plus the transient)
#
# max_accel 4.6 keeps the same 1.67x margin over peak demand that rescale 14
# has (3.5 over 2.095). See THE ACCELERATION CLAMP in testbed_fig4.yaml for why
# the margin matters. beta is 16 here, so the velocity-noise caution in that
# file applies with more force.

simulation:
  dt: 0.1
  control_rate: 10.0
  sim_rate: 10.0
  bounds: 1.5

drones:
  # Same marks as testbed_fig4.yaml. Fly drone1 and drone4 as the real pair --
  # see SEPARATION in that file.
  - id: "drone1"
    initial_position: [0.235, -0.132]
    initial_velocity: [0.0, 0.0]
    role: "leader"
  - id: "drone2"
    initial_position: [0.013, 0.070]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone3"
    initial_position: [-0.186, -0.034]
    initial_velocity: [0.0, 0.0]
    role: "follower"
  - id: "drone4"
    initial_position: [0.179, 0.219]
    initial_velocity: [0.0, 0.0]
    role: "follower"

algorithm:
  name: "TrochoidalConsensus"
  params:
    alpha: 12.9645
    beta:  16.0000
    kappa: 2.3269
    theta: 2.2849
    max_accel: 4.6
    adjacency:
      drone1: {drone3: 5.0}
      drone2: {drone1: 3.0, drone3: 1.0}
      drone3: {drone1: 1.0, drone4: 2.0}
      drone4: {drone1: 1.0, drone2: 5.0}
