# Expanding/contracting hexagon: use this SAME config for simulation and hybrid.
# Based on the static hybrid's geometry, gains, initial positions and anchor.
# Simulation: python3 run_sim.py --config testbed_hexagon_breathing.yaml
# Baseline: python3 tools/sim_baseline.py --config <this path> --duration 150
# Hybrid: ./fly.sh testbed_hexagon_breathing --real drone1,drone4 --duration 150 --record
# Real positions come from VICON: place real drones on their marks below.
# See docs/DISTANCE_BREATHING.md for the test sequence and recorded quantities.

simulation:
  dt: 0.1
  control_rate: 10.0
  sim_rate: 10.0
  bounds: 1.5

drones:
  - id: drone1
    initial_position: [0.59, -0.19]
    initial_velocity: [0.0, 0.0]
    role: leader
  - id: drone2
    initial_position: [0.17, 0.90]
    initial_velocity: [0.0, 0.0]
    role: follower
  - id: drone3
    initial_position: [-0.24, 0.17]
    initial_velocity: [0.0, 0.0]
    role: follower
  - id: drone4
    initial_position: [-0.93, -0.06]
    initial_velocity: [0.0, 0.0]
    role: follower
  - id: drone5
    initial_position: [-0.58, -0.68]
    initial_velocity: [0.0, 0.0]
    role: follower
  - id: drone6
    initial_position: [0.34, -0.95]
    initial_velocity: [0.0, 0.0]
    role: follower

algorithm:
  name: DistanceFormation
  params:
    side_length: 0.7              # Nominal side, metres; HOLD FIXED in sweeps.
    formation_center: [0.0, 0.0]  # Pivot used to scale the anchor target.
    formation_rotation: 0.0
    topology: octahedron         # HOLD FIXED: all ring AND chord targets scale.

    # MAIN TEST VARIABLE: seconds per full expansion/contraction cycle.
    # Current cycle is 20 s; compare 60, 30, 20, then 15 in simulation.
    # Smaller = faster moving target, larger tracking demand.
    breathing_period: 20.0

    # SECOND TEST VARIABLE: fractional size swing, not metres.
    # 0.15 / 0.7 = +/-21.43%: sides 0.55--0.85 m (30 cm peak-to-peak).
    # Compare amplitudes at a FIXED period. 0 restores static behaviour.
    breathing_amplitude: 0.2142857142857143

    # Experiment timing, in controller seconds (starts after takeoff hold).
    breathing_start_delay: 15.0   # Hold nominal size to form the hexagon first.
    breathing_ramp_duration: 5.0  # Smoothly introduce motion; > 0.

    # SECONDARY SWEEPS: change only one gain after the period/amplitude study.
    gain_kp: 0.45                 # Formation correction strength.
    gain_kv: 1.2                  # Velocity damping.
    max_accel: 3.5                # Per-axis limit; HOLD FIXED across sweeps,
                                  # but at 3.5 rather than the old 0.5.
                                  #
                                  # RAISED 6 Oct 2026. At the breathing
                                  # settings set in a121ded (period 20 s,
                                  # amplitude +/-21.4%) a 0.5 clamp saturates
                                  # drone1's commanded acceleration on 49.5%
                                  # of ticks in simulation -- peak demand is
                                  # 1.40 m/s^2, nearly 3x the clamp. Half the
                                  # run was therefore measuring the limiter
                                  # rather than gain_kp/gain_kv.
                                  #
                                  # Measured in sim at max_accel 0.5, so it is
                                  # clear which change did it -- the AMPLITUDE,
                                  # not the period:
                                  #     30 s, +/-10.0%   12.6% clipped
                                  #     20 s, +/-21.4%   49.5%
                                  #     20 s, +/-10.0%    7.8%
                                  #     30 s, +/-21.4%   38.9%
                                  #
                                  # At 3.5 the same demand clips 0%. 3.5 is
                                  # also what trochoidal, coverage, flocking
                                  # and kuramoto now use, so cross-algorithm
                                  # comparisons are not confounded by a
                                  # saturation difference.
                                  #
                                  # Any breathing data recorded BEFORE this
                                  # date was flown at 0.5 and is not directly
                                  # comparable with runs after it.

    # Same anchor as the static hybrid. Its nominal vertex scales about
    # formation_center: drone1's x target varies 0.55--0.85 m, y stays zero.
    # Do not use centroid invariance as a success criterion with an anchor.
    anchor: [drone1]
    anchor_gain_kp: 0.4
    anchor_gain_kd: 0.0
